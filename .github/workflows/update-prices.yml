# Updates gas and electricity prices every month from ARERA's official files.
# ARERA publishes gas within the first 2 working days of the month: the job runs
# on the 3rd, 5th and 8th (if the first try still finds last month, a later one
# picks it up). If reading fails or a price moves suspiciously, it publishes
# nothing and opens an issue.
name: Update ARERA prices

on:
  schedule:
    - cron: '0 6 3,5,8 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download and compute the prices
        run: python3 scripts/update_prices.py

      - name: Check the app works with the new prices
        run: |
          npm ci
          npm test

      - name: Publish if anything changed
        run: |
          if git diff --quiet src/prices.js; then
            echo "Prices unchanged"
            exit 0
          fi
          git config user.name "suntrace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/prices.js
          git commit -m "chore: ARERA prices updated automatically"
          git push

      - name: Yearly tax reminder
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%m-%d)" = "01-03" ]; then
            gh issue create --title "Gas and electricity taxes: check the factors" \
              --body "It is January: the budget law may have changed excise or VAT. Check scripts/price-taxes.json (procedure in docs/method.md)."
          fi

      - name: Report the problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "ARERA price update failed" \
            --body "The run of $(date +%Y-%m-%d) did not update the prices: the app keeps using the last valid ones. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
